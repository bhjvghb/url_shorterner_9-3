<svg viewBox="0 0 680 590" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>How to Create a Short Link</title>
  <desc>User journey: paste URL → choose options → get short link with QR code</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#1D9E75" font-size="16">创建一条短链接</text>
  <rect x="240" y="48" width="200" height="44" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#3C3489" font-size="13">粘贴长链接</text>
  <text x="340" y="84" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#534AB7">如 https://example.com/very/long/url</text>
  <line x1="340" y1="92" x2="340" y2="114" stroke="#534AB7" stroke-width="1" marker-end="url(#a1)"/>
  <rect x="220" y="118" width="240" height="44" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="136" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#085041" font-size="13">选择可选配置</text>
  <text x="340" y="152" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0F6E56">均可选，留空则使用默认值</text>
  <line x1="340" y1="162" x2="340" y2="178" stroke="#0F6E56" stroke-width="1" marker-end="url(#a1)"/>
  <rect x="40" y="182" width="600" height="52" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <rect x="60" y="196" width="135" height="28" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="127" y="214" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#0C447C" font-size="12">自定义短码</text>
  <rect x="205" y="196" width="135" height="28" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="272" y="214" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#0C447C" font-size="12">设置有效期</text>
  <rect x="350" y="196" width="135" height="28" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="417" y="214" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#0C447C" font-size="12">访问密码</text>
  <rect x="495" y="196" width="130" height="28" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="560" y="214" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#0C447C" font-size="12">添加标签</text>
  <line x1="340" y1="234" x2="340" y2="256" stroke="#185FA5" stroke-width="1" marker-end="url(#a1)"/>
  <rect x="260" y="260" width="160" height="40" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="284" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#712B13" font-size="14">点击「生成短链接」</text>
  <line x1="340" y1="300" x2="340" y2="324" stroke="#993C1D" stroke-width="1" marker-end="url(#a1)"/>
  <rect x="250" y="328" width="180" height="36" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="340" y="350" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#72243E" font-size="13">自定义短码可用吗？</text>
  <text x="210" y="372" font-family="system-ui,sans-serif" font-size="11" fill="#72243E">已被占用</text>
  <line x1="290" y1="346" x2="210" y2="346" stroke="#993556" stroke-width="1"/>
  <line x1="210" y1="346" x2="210" y2="400" stroke="#993556" stroke-width="1" marker-end="url(#a1)"/>
  <rect x="140" y="404" width="140" height="28" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="210" y="422" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#A32D2D">提示换一个短码</text>
  <text x="450" y="372" font-family="system-ui,sans-serif" font-size="11" fill="#72243E">可用 / 未指定</text>
  <line x1="390" y1="346" x2="490" y2="346" stroke="#993556" stroke-width="1"/>
  <line x1="490" y1="346" x2="490" y2="400" stroke="#993556" stroke-width="1" marker-end="url(#a1)"/>
  <rect x="390" y="404" width="200" height="28" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="490" y="422" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#27500A" font-size="12">自动分配唯一短码</text>
  <line x1="210" y1="432" x2="210" y2="454" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="210" y1="454" x2="490" y2="454" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="350" y="468" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#A32D2D">重新选择</text>
  <line x1="490" y1="454" x2="490" y2="488" stroke="#3B6D11" stroke-width="1" marker-end="url(#a1)"/>
  <rect x="240" y="492" width="200" height="44" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="508" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#085041" font-size="13">保存短链接</text>
  <text x="340" y="524" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0F6E56">自动生成二维码图片</text>
  <line x1="340" y1="536" x2="340" y2="552" stroke="#0F6E56" stroke-width="1" marker-end="url(#a1)"/>
  <rect x="180" y="556" width="320" height="32" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="340" y="576" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#27500A" font-size="14">获得短链接 + 二维码，可直接分享使用</text>
</svg>