<svg viewBox="0 0 680 620" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>URL Shortening Flow</title>
  <desc>POST /shorten: input → validate → custom code? → generate → insert DB → QR → result</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .th { font-family: -apple-system, system-ui, sans-serif; font-size: 14px; font-weight: 500; }
    .ts { font-family: -apple-system, system-ui, sans-serif; font-size: 12px; }
    .th13 { font-family: -apple-system, system-ui, sans-serif; font-size: 13px; font-weight: 500; }
    .ts11 { font-family: -apple-system, system-ui, sans-serif; font-size: 11px; }
    .ts10 { font-family: -apple-system, system-ui, sans-serif; font-size: 10px; }
  </style>

  <text x="340" y="24" text-anchor="middle" class="th" fill="#1D9E75" font-size="15">URL Shortening -- Core Flow (POST /shorten, /batch_shorten)</text>

  <rect x="260" y="44" width="160" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="64" text-anchor="middle" class="th13" fill="#3C3489">User submits long URL</text>
  <text x="340" y="74" text-anchor="middle" class="ts10" fill="#534AB7">+ optional custom_code / expiry / password</text>
  <line x1="340" y1="84" x2="340" y2="108" stroke="#534AB7" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="240" y="112" width="200" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="130" text-anchor="middle" class="th13" fill="#0C447C">Validate input (strip URL)</text>
  <line x1="340" y1="148" x2="340" y2="168" stroke="#185FA5" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="260" y="172" width="160" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="190" text-anchor="middle" class="th13" fill="#712B13">Add https:// if no scheme</text>
  <text x="340" y="204" text-anchor="middle" class="ts11" fill="#993C1D">Ensure URL starts with http:// or https://</text>
  <line x1="340" y1="212" x2="340" y2="236" stroke="#993C1D" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="250" y="240" width="180" height="36" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="340" y="260" text-anchor="middle" class="th13" fill="#72243E">Has custom code?</text>

  <text x="230" y="282" class="ts11" fill="#72243E">Yes</text>
  <line x1="340" y1="276" x2="200" y2="276" stroke="#993556" stroke-width="1"/>
  <line x1="200" y1="276" x2="200" y2="304" stroke="#993556" stroke-width="1" marker-end="url(#arr)"/>

  <text x="480" y="282" class="ts11" fill="#72243E">No (auto-generate)</text>
  <line x1="430" y1="258" x2="560" y2="258" stroke="#993556" stroke-width="1"/>
  <line x1="560" y1="258" x2="560" y2="304" stroke="#993556" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="110" y="308" width="180" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="200" y="326" text-anchor="middle" class="th13" fill="#27500A">Validate custom code</text>
  <text x="200" y="342" text-anchor="middle" class="ts10" fill="#3B6D11">len 3-20 · [a-zA-Z0-9_-] · not reserved</text>
  <text x="200" y="356" text-anchor="middle" class="ts10" fill="#3B6D11">check DB uniqueness</text>

  <rect x="470" y="308" width="180" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="560" y="326" text-anchor="middle" class="th13" fill="#27500A">Generate random 6-char code</text>
  <text x="560" y="342" text-anchor="middle" class="ts10" fill="#3B6D11">62 charset · max 10 retries</text>
  <text x="560" y="356" text-anchor="middle" class="ts10" fill="#3B6D11">check DB + reserved words</text>

  <line x1="200" y1="364" x2="200" y2="388" stroke="#3B6D11" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="560" y1="364" x2="560" y2="388" stroke="#3B6D11" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="110" y="392" width="180" height="28" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="200" y="406" text-anchor="middle" class="ts11" fill="#A32D2D">Invalid → render_error_page</text>

  <rect x="470" y="392" width="180" height="28" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="560" y="406" text-anchor="middle" class="ts11" fill="#A32D2D">All attempts fail → render_error_page</text>

  <line x1="290" y1="392" x2="340" y2="392" stroke="#3B6D11" stroke-width="1"/>
  <line x1="470" y1="378" x2="340" y2="378" stroke="#3B6D11" stroke-width="1"/>
  <line x1="340" y1="378" x2="340" y2="436" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="210" y="440" width="260" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="458" text-anchor="middle" class="th13" fill="#085041">INSERT INTO url_mappings</text>
  <text x="340" y="476" text-anchor="middle" class="ts11" fill="#0F6E56">long_url · short_code · is_custom · user_id · expires_at · password_hash</text>
  <line x1="340" y1="492" x2="340" y2="516" stroke="#0F6E56" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="210" y="520" width="260" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="536" text-anchor="middle" class="th13" fill="#0C447C">Generate QR Code</text>
  <text x="340" y="554" text-anchor="middle" class="ts11" fill="#185FA5">qrcode library → static/qrcodes/{short_code}.png</text>
  <line x1="340" y1="560" x2="340" y2="584" stroke="#185FA5" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="210" y="588" width="260" height="32" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="340" y="608" text-anchor="middle" class="th" fill="#27500A">Render success.html with short URL + QR</text>
</svg>