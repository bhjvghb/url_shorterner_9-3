<svg viewBox="0 0 680 560" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>LinkSnap System Architecture</title>
  <desc>Layered architecture: Browser → Flask Routes → Business Logic → Data Layer, with i18n, Cron, and Email services</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 2L5 8L9 2" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .t { font-family: -apple-system, system-ui, sans-serif; font-size: 14px; fill: #3C3489; }
    .ts { font-family: -apple-system, system-ui, sans-serif; font-size: 12px; }
    .th { font-family: -apple-system, system-ui, sans-serif; font-size: 14px; font-weight: 500; }
  </style>

  <text x="340" y="26" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-weight="500" fill="#3C3489" font-size="15">LinkSnap URL Shortener -- System Architecture</text>

  <rect x="40" y="42" width="600" height="56" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="62" text-anchor="middle" class="th" fill="#3C3489" font-size="14">Web Browser / API Client</text>
  <text x="340" y="80" text-anchor="middle" class="ts" fill="#534AB7" font-size="12">HTML pages · JavaScript (Chart.js, QR display) · AJAX batch requests</text>

  <g>
    <rect x="40" y="120" width="430" height="160" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="255" y="142" text-anchor="middle" class="th" fill="#085041" font-size="14">Flask Application (app.py)</text>

    <rect x="55" y="155" width="128" height="36" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="119" y="173" text-anchor="middle" class="th" fill="#085041" font-size="12">Static Files / Templates</text>

    <rect x="195" y="155" width="130" height="36" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="260" y="173" text-anchor="middle" class="th" fill="#085041" font-size="12">Route Dispatcher</text>

    <rect x="337" y="155" width="120" height="36" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="397" y="173" text-anchor="middle" class="th" fill="#085041" font-size="12">Session / Decorator</text>

    <rect x="55" y="205" width="128" height="28" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="119" y="219" text-anchor="middle" class="ts" fill="#085041" font-size="11">17 HTML templates</text>

    <rect x="195" y="205" width="130" height="28" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="260" y="219" text-anchor="middle" class="ts" fill="#085041" font-size="11">25+ route endpoints</text>

    <rect x="337" y="205" width="120" height="28" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="397" y="219" text-anchor="middle" class="ts" fill="#085041" font-size="11">login_required guard</text>
  </g>

  <g>
    <rect x="40" y="300" width="430" height="120" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="255" y="322" text-anchor="middle" class="th" fill="#0C447C" font-size="14">Core Business Logic</text>

    <rect x="55" y="335" width="90" height="34" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="100" y="352" text-anchor="middle" class="th" fill="#0C447C" font-size="12">URL Shorten</text>

    <rect x="155" y="335" width="90" height="34" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="200" y="352" text-anchor="middle" class="th" fill="#0C447C" font-size="12">Redirect</text>

    <rect x="255" y="335" width="90" height="34" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="300" y="352" text-anchor="middle" class="th" fill="#0C447C" font-size="12">Auth</text>

    <rect x="355" y="335" width="105" height="34" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="407" y="352" text-anchor="middle" class="th" fill="#0C447C" font-size="12">Analytics</text>

    <rect x="55" y="378" width="90" height="28" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="100" y="392" text-anchor="middle" class="ts" fill="#0C447C" font-size="11">gen + validate</text>

    <rect x="155" y="378" width="90" height="28" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="200" y="392" text-anchor="middle" class="ts" fill="#0C447C" font-size="11">+ geo + click</text>

    <rect x="255" y="378" width="90" height="28" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="300" y="392" text-anchor="middle" class="ts" fill="#0C447C" font-size="11">hash + session</text>

    <rect x="355" y="378" width="105" height="28" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="407" y="392" text-anchor="middle" class="ts" fill="#0C447C" font-size="11">stats + report</text>
  </g>

  <g>
    <rect x="40" y="440" width="430" height="68" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text x="255" y="460" text-anchor="middle" class="th" fill="#27500A" font-size="14">Data &amp; Storage Layer</text>

    <rect x="55" y="472" width="195" height="28" rx="6" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
    <text x="152" y="486" text-anchor="middle" class="th" fill="#27500A" font-size="12">PostgreSQL / SQLite (auto-switch)</text>

    <rect x="262" y="472" width="195" height="28" rx="6" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
    <text x="359" y="486" text-anchor="middle" class="th" fill="#27500A" font-size="12">QR Code PNG (static/qrcodes/)</text>
  </g>

  <g>
    <rect x="490" y="120" width="150" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="565" y="142" text-anchor="middle" class="th" fill="#712B13" font-size="13">i18n Engine</text>
    <text x="565" y="160" text-anchor="middle" class="ts" fill="#993C1D" font-size="11">zh-CN · en · zh-HK</text>
  </g>

  <g>
    <rect x="490" y="190" width="150" height="46" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="565" y="207" text-anchor="middle" class="th" fill="#712B13" font-size="13">Cron Jobs</text>
    <text x="565" y="223" text-anchor="middle" class="ts" fill="#993C1D" font-size="11">expiry reminder · cleanup</text>
  </g>

  <g>
    <rect x="490" y="250" width="150" height="46" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="565" y="267" text-anchor="middle" class="th" fill="#712B13" font-size="13">Email Service</text>
    <text x="565" y="283" text-anchor="middle" class="ts" fill="#993C1D" font-size="11">SMTP · password reset</text>
  </g>

  <text x="110" y="278" class="ts" fill="#712B13" font-size="11">uwsgi/gunicorn</text>
  <line x1="100" y1="280" x2="40" y2="280" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="3,3"/>

  <line x1="340" y1="98" x2="340" y2="116" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="230" y1="280" x2="230" y2="296" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="230" y1="420" x2="230" y2="436" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
</svg>