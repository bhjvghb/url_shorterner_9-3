<svg viewBox="0 0 680 670" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>URL Redirection & Access Flow</title>
  <desc>GET /short_code: lookup → expired? → password? → record click + geo → 302 redirect</desc>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .th { font-family: -apple-system, system-ui, sans-serif; font-size: 14px; font-weight: 500; }
    .ts { font-family: -apple-system, system-ui, sans-serif; font-size: 12px; }
    .th13 { font-family: -apple-system, system-ui, sans-serif; font-size: 13px; font-weight: 500; }
    .ts11 { font-family: -apple-system, system-ui, sans-serif; font-size: 11px; }
    .ts10 { font-family: -apple-system, system-ui, sans-serif; font-size: 10px; }
  </style>

  <text x="340" y="24" text-anchor="middle" class="th" fill="#BA7517" font-size="15">URL Redirection &amp; Access Flow (GET /&lt;short_code&gt;)</text>

  <rect x="260" y="44" width="160" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="66" text-anchor="middle" class="th13" fill="#3C3489">User clicks short link</text>
  <line x1="340" y1="80" x2="340" y2="104" stroke="#534AB7" stroke-width="1" marker-end="url(#arr2)"/>

  <rect x="240" y="108" width="200" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="130" text-anchor="middle" class="th13" fill="#085041">Query url_mappings by short_code</text>
  <line x1="340" y1="144" x2="340" y2="168" stroke="#0F6E56" stroke-width="1" marker-end="url(#arr2)"/>

  <rect x="260" y="172" width="160" height="36" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="340" y="194" text-anchor="middle" class="th13" fill="#72243E">Found in database?</text>

  <text x="170" y="216" class="ts11" fill="#72243E">No</text>
  <line x1="260" y1="190" x2="170" y2="190" stroke="#993556" stroke-width="1"/>
  <line x1="170" y1="190" x2="170" y2="248" stroke="#993556" stroke-width="1" marker-end="url(#arr2)"/>

  <rect x="100" y="252" width="140" height="28" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="170" y="270" text-anchor="middle" class="ts11" fill="#A32D2D">404 Page Not Found</text>

  <text x="520" y="216" class="ts11" fill="#72243E">Yes</text>
  <line x1="420" y1="190" x2="520" y2="190" stroke="#993556" stroke-width="1"/>
  <line x1="520" y1="190" x2="520" y2="248" stroke="#993556" stroke-width="1" marker-end="url(#arr2)"/>

  <rect x="440" y="252" width="160" height="36" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="520" y="274" text-anchor="middle" class="th13" fill="#72243E">Link expired?</text>

  <text x="440" y="300" class="ts11" fill="#72243E">Yes</text>
  <line x1="480" y1="272" x2="440" y2="272" stroke="#993556" stroke-width="1"/>
  <line x1="440" y1="272" x2="440" y2="324" stroke="#993556" stroke-width="1" marker-end="url(#arr2)"/>

  <rect x="370" y="328" width="140" height="28" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="440" y="346" text-anchor="middle" class="ts11" fill="#A32D2D">410 Gone (Expired)</text>

  <text x="600" y="300" class="ts11" fill="#72243E">No</text>
  <line x1="560" y1="272" x2="600" y2="272" stroke="#993556" stroke-width="1"/>
  <line x1="600" y1="272" x2="600" y2="324" stroke="#993556" stroke-width="1" marker-end="url(#arr2)"/>

  <rect x="500" y="328" width="160" height="36" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="580" y="350" text-anchor="middle" class="th13" fill="#72243E">Password protected?</text>

  <text x="520" y="378" class="ts11" fill="#72243E">Yes</text>
  <line x1="540" y1="346" x2="520" y2="346" stroke="#993556" stroke-width="1"/>
  <line x1="520" y1="346" x2="520" y2="404" stroke="#993556" stroke-width="1" marker-end="url(#arr2)"/>

  <rect x="430" y="408" width="180" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="520" y="424" text-anchor="middle" class="th13" fill="#712B13">Redirect to /p/&lt;code&gt;</text>
  <text x="520" y="442" text-anchor="middle" class="ts11" fill="#993C1D">User enters password → verify → redirect</text>

  <text x="640" y="378" class="ts11" fill="#72243E">No</text>
  <line x1="620" y1="346" x2="660" y2="346" stroke="#993556" stroke-width="1"/>
  <line x1="660" y1="346" x2="660" y2="404" stroke="#993556" stroke-width="1" marker-end="url(#arr2)"/>

  <rect x="560" y="408" width="100" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="610" y="424" text-anchor="middle" class="th13" fill="#27500A">Allow access</text>
  <text x="610" y="442" text-anchor="middle" class="ts11" fill="#3B6D11">Proceed</text>

  <line x1="520" y1="452" x2="520" y2="480" stroke="#993C1D" stroke-width="1"/>
  <line x1="660" y1="452" x2="660" y2="480" stroke="#3B6D11" stroke-width="1"/>
  <line x1="520" y1="480" x2="660" y2="480" stroke="#888780" stroke-width="1"/>
  <line x1="590" y1="480" x2="590" y2="504" stroke="#888780" stroke-width="1" marker-end="url(#arr2)"/>

  <rect x="210" y="508" width="260" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="526" text-anchor="middle" class="th13" fill="#0C447C">Record click data</text>
  <text x="340" y="542" text-anchor="middle" class="ts10" fill="#185FA5">UPDATE click_count + 1</text>
  <text x="340" y="556" text-anchor="middle" class="ts11" fill="#185FA5">INSERT INTO clicks (IP, UA, referer, geo)</text>
  <line x1="340" y1="560" x2="340" y2="584" stroke="#185FA5" stroke-width="1" marker-end="url(#arr2)"/>

  <rect x="250" y="588" width="180" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="610" text-anchor="middle" class="th13" fill="#085041">IP Geolocation (ip-api.com)</text>
  <line x1="340" y1="624" x2="340" y2="640" stroke="#0F6E56" stroke-width="1" marker-end="url(#arr2)"/>

  <rect x="240" y="642" width="200" height="28" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="340" y="660" text-anchor="middle" class="th" fill="#27500A">302 Redirect → long_url</text>
</svg>