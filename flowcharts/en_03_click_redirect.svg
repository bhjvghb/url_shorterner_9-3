<svg viewBox="0 0 680 570" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>What Happens When Someone Clicks</title>
  <desc>Click → lookup → not found / expired / valid → password? → unlock → track → redirect</desc>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#BA7517" font-size="16">What Happens on Click</text>
  <rect x="230" y="46" width="220" height="38" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#3C3489" font-size="14">Someone opens the short link</text>
  <line x1="340" y1="84" x2="340" y2="106" stroke="#534AB7" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="250" y="110" width="180" height="36" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#085041" font-size="14">Look up the link</text>
  <line x1="340" y1="146" x2="340" y2="168" stroke="#0F6E56" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="270" y="172" width="140" height="32" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="340" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#72243E" font-size="13">Link status?</text>
  <line x1="230" y1="188" x2="190" y2="188" stroke="#A32D2D" stroke-width="1"/>
  <line x1="190" y1="188" x2="190" y2="236" stroke="#A32D2D" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="120" y="240" width="140" height="26" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="190" y="257" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#A32D2D">Not Found</text>
  <line x1="490" y1="188" x2="520" y2="188" stroke="#D85A30" stroke-width="1"/>
  <line x1="520" y1="188" x2="520" y2="236" stroke="#D85A30" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="450" y="240" width="140" height="26" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="520" y="257" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#712B13">Expired</text>
  <line x1="340" y1="204" x2="340" y2="246" stroke="#0F6E56" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="270" y="250" width="140" height="32" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#0C447C" font-size="14">Valid</text>
  <line x1="340" y1="282" x2="340" y2="304" stroke="#185FA5" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="270" y="308" width="140" height="32" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="340" y="328" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#72243E" font-size="13">Password lock?</text>
  <text x="210" y="338" font-family="system-ui,sans-serif" font-size="11" fill="#72243E">Yes</text>
  <line x1="290" y1="324" x2="210" y2="324" stroke="#993556" stroke-width="1"/>
  <line x1="210" y1="324" x2="210" y2="382" stroke="#993556" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="110" y="386" width="200" height="44" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="210" y="404" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#712B13" font-size="13">Enter password to unlock</text>
  <text x="210" y="422" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#993C1D">Correct → proceed</text>
  <text x="450" y="338" font-family="system-ui,sans-serif" font-size="11" fill="#72243E">No</text>
  <line x1="390" y1="324" x2="490" y2="324" stroke="#993556" stroke-width="1"/>
  <line x1="490" y1="324" x2="490" y2="382" stroke="#993556" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="410" y="386" width="160" height="44" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="490" y="404" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#27500A" font-size="13">Pass</text>
  <text x="490" y="422" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3B6D11">Open directly</text>
  <line x1="210" y1="430" x2="210" y2="456" stroke="#993C1D" stroke-width="1"/>
  <line x1="490" y1="430" x2="490" y2="456" stroke="#3B6D11" stroke-width="1"/>
  <line x1="210" y1="456" x2="490" y2="456" stroke="#888780" stroke-width="1"/>
  <line x1="350" y1="456" x2="350" y2="476" stroke="#888780" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="210" y="480" width="260" height="26" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="497" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#085041" font-size="13">Redirect to destination page</text>
  <line x1="340" y1="506" x2="340" y2="516" stroke="#0F6E56" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="40" y="520" width="180" height="24" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="130" y="536" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">+1 click count</text>
  <rect x="250" y="520" width="180" height="24" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="536" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">Geo + IP</text>
  <rect x="460" y="520" width="180" height="24" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="550" y="536" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">Device + referrer</text>
</svg>