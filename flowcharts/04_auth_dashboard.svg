<svg viewBox="0 0 680 680" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>User Authentication & Dashboard Flow</title>
  <desc>Register → Login → Dashboard (CRUD links, stats, report, admin)</desc>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .th { font-family: -apple-system, system-ui, sans-serif; font-size: 14px; font-weight: 500; }
    .ts { font-family: -apple-system, system-ui, sans-serif; font-size: 12px; }
    .th13 { font-family: -apple-system, system-ui, sans-serif; font-size: 13px; font-weight: 500; }
    .th12 { font-family: -apple-system, system-ui, sans-serif; font-size: 12px; font-weight: 500; }
    .ts11 { font-family: -apple-system, system-ui, sans-serif; font-size: 11px; }
    .ts10 { font-family: -apple-system, system-ui, sans-serif; font-size: 10px; }
  </style>

  <text x="340" y="24" text-anchor="middle" class="th" fill="#534AB7" font-size="15">User Authentication, Dashboard &amp; Analytics Flow</text>

  <rect x="40" y="42" width="600" height="160" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="62" text-anchor="middle" class="th" fill="#444441" font-size="14">Authentication System</text>

  <rect x="56" y="76" width="130" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="121" y="94" text-anchor="middle" class="th12" fill="#3C3489">Register</text>
  <text x="121" y="110" text-anchor="middle" class="ts10" fill="#534AB7">POST /register</text>

  <line x1="186" y1="98" x2="218" y2="98" stroke="#534AB7" stroke-width="1" marker-end="url(#arr3)"/>

  <rect x="222" y="76" width="130" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="287" y="94" text-anchor="middle" class="th12" fill="#0C447C">Login</text>
  <text x="287" y="110" text-anchor="middle" class="ts10" fill="#185FA5">POST /login</text>

  <line x1="352" y1="98" x2="390" y2="98" stroke="#185FA5" stroke-width="1" marker-end="url(#arr3)"/>

  <rect x="394" y="76" width="120" height="28" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="454" y="94" text-anchor="middle" class="th12" fill="#085041">Session created</text>

  <rect x="56" y="134" width="130" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="121" y="152" text-anchor="middle" class="th12" fill="#712B13">Forgot Password</text>
  <text x="121" y="168" text-anchor="middle" class="ts10" fill="#993C1D">/forgot-password</text>

  <line x1="186" y1="156" x2="218" y2="156" stroke="#993C1D" stroke-width="1" marker-end="url(#arr3)"/>

  <rect x="222" y="134" width="130" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="287" y="152" text-anchor="middle" class="th12" fill="#27500A">Reset via Email</text>
  <text x="287" y="168" text-anchor="middle" class="ts10" fill="#3B6D11">SMTP send + token</text>

  <line x1="352" y1="156" x2="394" y2="156" stroke="#3B6D11" stroke-width="1" marker-end="url(#arr3)"/>

  <rect x="394" y="138" width="120" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="454" y="152" text-anchor="middle" class="th12" fill="#085041">POST /reset-password</text>
  <text x="454" y="168" text-anchor="middle" class="ts10" fill="#0F6E56">set new password</text>

  <rect x="540" y="76" width="88" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="584" y="94" text-anchor="middle" class="th12" fill="#A32D2D">Logout</text>
  <text x="584" y="110" text-anchor="middle" class="ts10" fill="#A32D2D">clear session</text>

  <line x1="340" y1="202" x2="340" y2="230" stroke="#888780" stroke-width="1.5" marker-end="url(#arr3)"/>

  <rect x="40" y="234" width="600" height="140" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="254" text-anchor="middle" class="th" fill="#0C447C" font-size="14">Dashboard (GET /dashboard) -- @login_required</text>

  <rect x="56" y="268" width="110" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="111" y="286" text-anchor="middle" class="th12" fill="#0C447C">List all links</text>
  <text x="111" y="302" text-anchor="middle" class="ts10" fill="#185FA5">paginated · search</text>

  <rect x="176" y="268" width="110" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="231" y="286" text-anchor="middle" class="th12" fill="#0C447C">Edit Link</text>
  <text x="231" y="302" text-anchor="middle" class="ts10" fill="#185FA5">POST /edit/&lt;code&gt;</text>

  <rect x="296" y="268" width="110" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="351" y="286" text-anchor="middle" class="th12" fill="#0C447C">Delete Link</text>
  <text x="351" y="302" text-anchor="middle" class="ts10" fill="#185FA5">POST /delete/&lt;code&gt;</text>

  <rect x="416" y="268" width="110" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="471" y="286" text-anchor="middle" class="th12" fill="#0C447C">Extend Expiry</text>
  <text x="471" y="302" text-anchor="middle" class="ts10" fill="#185FA5">POST /extend/&lt;code&gt;</text>

  <rect x="536" y="268" width="88" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="580" y="286" text-anchor="middle" class="th12" fill="#0C447C">Tag</text>
  <text x="580" y="302" text-anchor="middle" class="ts10" fill="#185FA5">/tag/&lt;code&gt;</text>

  <rect x="56" y="322" width="274" height="24" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="193" y="338" text-anchor="middle" class="ts11" fill="#0C447C">owner check + admin override · QR preview · password reveal</text>

  <line x1="340" y1="374" x2="340" y2="402" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arr3)"/>

  <rect x="40" y="406" width="600" height="150" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="426" text-anchor="middle" class="th" fill="#085041" font-size="14">Analytics &amp; Reports</text>

  <rect x="56" y="440" width="270" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="191" y="458" text-anchor="middle" class="th13" fill="#085041">Click Statistics (GET /stats/&lt;code&gt;)</text>
  <text x="191" y="474" text-anchor="middle" class="ts10" fill="#0F6E56">daily trend · referrer · browser · OS · country</text>
  <text x="191" y="490" text-anchor="middle" class="ts10" fill="#0F6E56">Chart.js interactive charts</text>

  <rect x="346" y="440" width="278" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="485" y="458" text-anchor="middle" class="th13" fill="#085041">Detailed Report (GET /report/&lt;code&gt;)</text>
  <text x="485" y="474" text-anchor="middle" class="ts10" fill="#0F6E56">total clicks · unique IPs · first/last access</text>
  <text x="485" y="490" text-anchor="middle" class="ts10" fill="#0F6E56">full geo + device breakdown</text>

  <rect x="56" y="510" width="568" height="28" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="528" text-anchor="middle" class="ts11" fill="#085041">Shared: get_click_analytics() → parses User-Agent, groups by date/domain/country, returns dict</text>

  <line x1="340" y1="556" x2="340" y2="580" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arr3)"/>

  <rect x="40" y="584" width="600" height="52" rx="12" fill="#FAECEE" stroke="#993556" stroke-width="0.5"/>
  <text x="340" y="604" text-anchor="middle" class="th" fill="#72243E" font-size="14">Admin Panel (GET /admin) -- username="admin" only</text>
  <text x="340" y="622" text-anchor="middle" class="ts11" fill="#993556">Global stats · recent links · user list · delete user/link · system overview</text>

  <rect x="40" y="648" width="600" height="28" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="666" text-anchor="middle" class="ts11" fill="#3C3489">Cron: /cron/expiry-reminder (30min warning) · /cron/cleanup-expired (count) -- token-protected</text>
</svg>