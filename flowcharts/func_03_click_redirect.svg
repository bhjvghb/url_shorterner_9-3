<svg viewBox="0 0 680 580" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>What Happens When Someone Clicks a Short Link</title>
  <desc>Click → check status → password? → redirect to destination, all tracked</desc>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#BA7517" font-size="16">有人点击了短链接，会发生什么？</text>
  <rect x="230" y="48" width="220" height="40" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#3C3489" font-size="14">收到短链接 👆 点击打开</text>
  <line x1="340" y1="88" x2="340" y2="110" stroke="#534AB7" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="240" y="114" width="200" height="40" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="138" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#085041" font-size="14">查找对应的原始链接</text>
  <line x1="340" y1="154" x2="340" y2="176" stroke="#0F6E56" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="260" y="180" width="160" height="36" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="340" y="202" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#72243E" font-size="13">链接状态检查</text>
  <line x1="210" y1="198" x2="210" y2="240" stroke="#A32D2D" stroke-width="1"/>
  <line x1="250" y1="198" x2="170" y2="198" stroke="#A32D2D" stroke-width="1"/>
  <rect x="140" y="244" width="140" height="28" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="210" y="262" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#A32D2D">链接不存在 💔</text>
  <line x1="470" y1="198" x2="510" y2="198" stroke="#D85A30" stroke-width="1"/>
  <line x1="510" y1="198" x2="510" y2="240" stroke="#D85A30" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="440" y="244" width="140" height="28" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="510" y="262" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#712B13">链接已过期 ⏰</text>
  <line x1="340" y1="216" x2="340" y2="248" stroke="#0F6E56" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="250" y="252" width="180" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="274" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#0C447C" font-size="14">链接有效 ✓</text>
  <line x1="340" y1="288" x2="340" y2="312" stroke="#185FA5" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="250" y="316" width="180" height="36" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="340" y="338" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#72243E" font-size="13">需要密码？</text>
  <text x="210" y="360" font-family="system-ui,sans-serif" font-size="11" fill="#72243E">需要</text>
  <line x1="290" y1="334" x2="210" y2="334" stroke="#993556" stroke-width="1"/>
  <line x1="210" y1="334" x2="210" y2="396" stroke="#993556" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="110" y="400" width="200" height="48" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="210" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#712B13" font-size="13">输入密码解锁</text>
  <text x="210" y="438" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#993C1D">密码正确 → 继续跳转</text>
  <text x="450" y="360" font-family="system-ui,sans-serif" font-size="11" fill="#72243E">无需密码</text>
  <line x1="390" y1="334" x2="490" y2="334" stroke="#993556" stroke-width="1"/>
  <line x1="490" y1="334" x2="490" y2="396" stroke="#993556" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="400" y="400" width="180" height="48" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="490" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#27500A" font-size="13">直接放行</text>
  <text x="490" y="438" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3B6D11">无需额外验证</text>
  <line x1="210" y1="448" x2="210" y2="474" stroke="#993C1D" stroke-width="1"/>
  <line x1="490" y1="448" x2="490" y2="474" stroke="#3B6D11" stroke-width="1"/>
  <line x1="210" y1="474" x2="490" y2="474" stroke="#888780" stroke-width="1"/>
  <line x1="350" y1="474" x2="350" y2="494" stroke="#888780" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="210" y="498" width="260" height="28" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="516" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#085041" font-size="13">到达目标网页 🎯 全程自动记录访问</text>
  <line x1="340" y1="526" x2="340" y2="534" stroke="#0F6E56" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="40" y="538" width="180" height="28" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="130" y="556" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">📊 记录点击次数 +1</text>
  <rect x="250" y="538" width="180" height="28" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="556" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">🌍 记录地理位置</text>
  <rect x="460" y="538" width="180" height="28" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="550" y="556" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">📱 记录设备与来源</text>
</svg>