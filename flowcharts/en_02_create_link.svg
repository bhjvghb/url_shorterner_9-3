<svg viewBox="0 0 680 550" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>How to Shorten a URL</title>
  <desc>Paste URL → pick options → click shorten → get short link + QR</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="340" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#1D9E75" font-size="16">How to Shorten a URL</text>
  <rect x="250" y="46" width="180" height="44" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="64" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#3C3489" font-size="13">Paste your long URL</text>
  <text x="340" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#534AB7">e.g. https://example.com/very-long/url</text>
  <line x1="340" y1="90" x2="340" y2="112" stroke="#534AB7" stroke-width="1" marker-end="url(#a1)"/>
  <rect x="220" y="116" width="240" height="40" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#085041" font-size="13">Choose options (all optional)</text>
  <line x1="340" y1="156" x2="340" y2="172" stroke="#0F6E56" stroke-width="1" marker-end="url(#a1)"/>
  <rect x="40" y="176" width="600" height="48" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <rect x="58" y="190" width="130" height="24" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="123" y="206" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#0C447C" font-size="12">Custom Alias</text>
  <rect x="198" y="190" width="130" height="24" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="263" y="206" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#0C447C" font-size="12">Expiry Date</text>
  <rect x="338" y="190" width="130" height="24" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="403" y="206" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#0C447C" font-size="12">Password</text>
  <rect x="478" y="190" width="146" height="24" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="551" y="206" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#0C447C" font-size="12">Tags</text>
  <line x1="340" y1="224" x2="340" y2="246" stroke="#185FA5" stroke-width="1" marker-end="url(#a1)"/>
  <rect x="260" y="250" width="160" height="40" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="274" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#712B13" font-size="14">Click "Shorten"</text>
  <line x1="340" y1="290" x2="340" y2="312" stroke="#993C1D" stroke-width="1" marker-end="url(#a1)"/>
  <rect x="260" y="316" width="160" height="32" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="340" y="336" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#72243E" font-size="13">Alias available?</text>
  <text x="210" y="342" font-family="system-ui,sans-serif" font-size="11" fill="#72243E">Taken</text>
  <line x1="290" y1="332" x2="210" y2="332" stroke="#993556" stroke-width="1"/>
  <line x1="210" y1="332" x2="210" y2="368" stroke="#993556" stroke-width="1" marker-end="url(#a1)"/>
  <rect x="140" y="372" width="140" height="26" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="210" y="389" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#A32D2D">Try another alias</text>
  <text x="450" y="342" font-family="system-ui,sans-serif" font-size="11" fill="#72243E">Yes</text>
  <line x1="390" y1="332" x2="490" y2="332" stroke="#993556" stroke-width="1"/>
  <line x1="490" y1="332" x2="490" y2="368" stroke="#993556" stroke-width="1" marker-end="url(#a1)"/>
  <rect x="390" y="372" width="200" height="26" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="490" y="389" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#27500A" font-size="12">Assign unique short code</text>
  <line x1="210" y1="398" x2="210" y2="416" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="210" y1="416" x2="490" y2="416" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="350" y="428" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#A32D2D">Retry</text>
  <line x1="490" y1="416" x2="490" y2="440" stroke="#3B6D11" stroke-width="1" marker-end="url(#a1)"/>
  <rect x="250" y="444" width="180" height="32" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="464" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#085041" font-size="13">Save + generate QR code</text>
  <line x1="340" y1="476" x2="340" y2="492" stroke="#0F6E56" stroke-width="1" marker-end="url(#a1)"/>
  <rect x="200" y="496" width="280" height="28" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="340" y="514" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" fill="#27500A" font-size="13">Short link ready — copy, share, or embed QR</text>
</svg>